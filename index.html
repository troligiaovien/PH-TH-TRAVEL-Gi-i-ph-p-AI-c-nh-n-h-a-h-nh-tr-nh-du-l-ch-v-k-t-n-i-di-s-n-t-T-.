    <script>
      // Polyfill setter for window.fetch to prevent browser extension conflicts
      try {
        var _currentFetch = window.fetch ? window.fetch.bind(window) : undefined;
        Object.defineProperty(window, 'fetch', {
          get: function() {
            return _currentFetch;
          },
          set: function(fn) {
            _currentFetch = fn;
          },
          configurable: true,
          enumerable: true
        });
      } catch (e) {}

      // Catch and silence unhandled extension injection errors
      window.addEventListener('error', function(event) {
        if (
          (event.filename && event.filename.indexOf('chrome-extension://') !== -1) ||
          (event.message && (
            event.message.indexOf('Cannot set property fetch') !== -1 ||
            event.message.indexOf('fetch of #<Window>') !== -1
          ))
        ) {
          event.preventDefault();
          event.stopImmediatePropagation();
          return true;
        }
      }, true);
    </script>
